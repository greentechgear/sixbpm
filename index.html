<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8f8">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Permissions-Policy" content="accelerometer=(self), gyroscope=(self)">
    <title>sixbpm</title>
    <link rel="manifest" href="manifest.json?v=cache-v20">
    <link rel="stylesheet" href="style.css?v=cache-v20">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
  </head>
  <body>
    <main class="app-shell" aria-label="sixbpm breathing pacer">
      <section class="orb-section" aria-live="polite">
        <div class="orb-wrap" aria-hidden="true">
          <div id="orb" class="orb"></div>
        </div>
        <div id="phaseLabel" class="phase-label">READY</div>
      </section>

      <section class="stats" aria-label="session stats">
        <article class="stat-card">
          <span class="stat-label">Target BPM</span>
          <strong id="targetBpm">--</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Your BPM</span>
          <strong id="userBpm">--</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Time remaining</span>
          <strong id="timeRemaining">15:00</strong>
        </article>
      </section>

      <section class="controls" aria-label="session controls">
        <label class="control">
          <span>Inhale:exhale ratio <output id="ratioValue">1:2.0</output></span>
          <input id="ratioSlider" type="range" min="1" max="2.5" step="0.1" value="2">
        </label>
        <label class="control">
          <span>Floor BPM <output id="floorValue">6</output></span>
          <input id="floorSlider" type="range" min="5" max="10" step="0.1" value="6">
        </label>
        <label class="control">
          <span>Tone volume <output id="volumeValue">55</output></span>
          <input id="volumeSlider" type="range" min="0" max="100" step="1" value="55">
        </label>
      </section>

      <section class="status-row" aria-live="polite">
        <div id="versionLabel" class="version-label">Version: loading</div>
        <div class="sensor-status">
          <span id="sensorDot" class="sensor-dot"></span>
          <span id="sensorLabel">Sensor: not started</span>
        </div>
        <p id="statusMessage" class="status-message">Ready.</p>
      </section>

      <section class="buttons" aria-label="actions">
        <button id="startButton" type="button">Start session</button>
        <button id="stopButton" type="button" disabled>Stop</button>
        <button id="testButton" type="button">Test tones</button>
        <button id="copyReportButton" type="button">Copy report</button>
      </section>

      <section class="debug-section" aria-label="sensor debug">
        <div class="debug-line" id="debugLine">Sensor debug: idle</div>
        <div class="debug-line" id="debugSample">Last sample: none</div>
      </section>

      <section id="reportSection" class="report-section" aria-label="diagnostic report" hidden>
        <label for="reportText">Diagnostic report</label>
        <textarea id="reportText" class="report-text" readonly></textarea>
      </section>

      <section class="log-section" aria-label="session log">
        <pre id="sessionLog" class="session-log" tabindex="0"></pre>
      </section>

      <footer class="app-footer">
        <a href="about.html">why 6?</a>
        <a href="vagal-tone.html">vagal tone</a>
      </footer>
    </main>

    <script src="app.js?v=cache-v20" defer></script>
  </body>
</html>
